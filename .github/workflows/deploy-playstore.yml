name: Deploy Android to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      rollout:
        description: 'Share of users who get the update (0.1 = 10%, 1 = everyone). Below 1, it is a staged rollout you widen in Play Console.'
        required: true
        default: '1'
  push:
    tags:
      - 'v*.*.*'

# Least privilege: these jobs only need to read the repository
permissions:
  contents: read

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    # `secrets` cannot be used in a step `if:`, so it is exposed through the job env
    env:
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: the commit count is the versionCode

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default package list includes the obsolete 'tools' package, which no longer exists
          packages: 'platform-tools'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $(git rev-list --count HEAD))"

      - name: Install NPM dependencies
        run: npm ci

      - name: Type check & unit tests
        run: npm run typecheck && npm test

      - name: Build Web Assets & Sync to Capacitor
        run: npm run cap:sync

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing: the bundle cannot be signed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed Android App Bundle (AAB)
        working-directory: ./android
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Verify bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Keep the bundle as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromasync-aab-${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        if: ${{ env.PLAY_STORE_JSON_KEY != '' && (github.event.inputs.rollout || '1') == '1' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.chromasync.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      # Staged rollout: only a share of users get the update; widen or halt it in Play Console
      - name: Upload to Google Play (staged rollout)
        if: ${{ env.PLAY_STORE_JSON_KEY != '' && (github.event.inputs.rollout || '1') != '1' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.chromasync.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew
          track: ${{ github.event.inputs.track || 'internal' }}
          status: inProgress
          userFraction: ${{ github.event.inputs.rollout }}

      - name: Explain skipped upload
        if: ${{ env.PLAY_STORE_JSON_KEY == '' }}
        run: echo "::warning::PLAY_STORE_JSON_KEY is not set; the signed AAB is available as a workflow artifact for manual upload."
