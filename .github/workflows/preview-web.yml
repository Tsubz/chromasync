name: Preview Web on Firebase

# Each pull request gets its own temporary URL (expires after 7 days); the link is posted
# on the PR so changes can be tried on a phone before merging.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write  # comment with the preview link
  checks: write         # report the deploy status

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Secrets are not available to pull requests from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Deploy to a preview channel
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHROMASYNC_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: chromasync-app
          expires: 7d
