name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main  # main is verified by the deploy workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run test:e2e

  # Compiles the Android app (debug APK + unsigned release bundle with R8) so native
  # breakages are caught on pull requests, not on release day
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list includes the obsolete 'tools' package, which no longer exists
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & sync to Capacitor
        run: npm run cap:sync

      - name: Build debug APK and release bundle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease lintRelease

      - name: Keep the debug APK for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: chromasync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

