name: Build & Publish Direct Android APK Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the commit count is the versionCode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve release version
        id: version
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}
        run: |
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install NPM dependencies
        run: npm ci

      - name: Type check & unit tests
        run: npm run typecheck && npm test

      - name: Build Web Assets & Sync to Capacitor
        run: npm run cap:sync

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing: the APK cannot be signed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        working-directory: ./android
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Verify signature and rename APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release-dist
          cp android/app/build/outputs/apk/release/app-release.apk "release-dist/chromasync-${{ steps.version.outputs.tag }}.apk"

      - name: Upload Signed APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromasync-android-apk
          path: release-dist/chromasync-${{ steps.version.outputs.tag }}.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version_tag != ''
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Chromasync ${{ steps.version.outputs.tag }}
          body: |
            ### Chromasync — guided breathing with living light and sound

            **Direct Android install:** download `chromasync-${{ steps.version.outputs.tag }}.apk` below.

            - Resonance breathing (adjustable 4.5–7 breaths/min), physiological sigh, box, 4-7-8, Deep Unwind and free breath
            - Generative visuals and sound, no audio or image files
            - English and French, works offline
            - Free and open source: no ads, no account, no tracking ([privacy policy](https://chromasync-app.web.app/privacy))

            Chromasync is a relaxation tool, not a medical device.
          files: release-dist/chromasync-${{ steps.version.outputs.tag }}.apk
