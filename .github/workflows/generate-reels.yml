name: Generate Media Reels & Video Assets

on:
  workflow_dispatch:

# Only uploads a workflow artifact: read access is enough
permissions:
  contents: read

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  render-reels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg with librsvg support
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate sequential frames & 432Hz procedural audio
        run: node scripts/render_video_reels.mjs

      - name: Compile High-Fidelity MP4 Video (30 FPS + 432 Hz Stereo)
        run: |
          mkdir -p media-reels/mp4
          ffmpeg -y \
            -r 30 \
            -i media-reels/frames/frame_%04d.svg \
            -i media-reels/audio_432hz.wav \
            -c:v libx264 \
            -preset slow \
            -crf 18 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -shortest \
            media-reels/mp4/chromasync-reel-vertical-1080x1920.mp4

      - name: Upload High-Definition Video Reels Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromasync-hd-reels
          path: media-reels/mp4/
