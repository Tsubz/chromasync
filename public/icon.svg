<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="1" />
      <stop offset="35%" stop-color="#ff7675" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#6c5ce7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0d0f14" />
  <circle cx="256" cy="256" r="180" fill="url(#grad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.85" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
</svg>
